<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Blackbox app icon, "The Masked Void": a glowing prompt on a black tile. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18191b"/>
      <stop offset="1" stop-color="#060607"/>
    </linearGradient>
    <linearGradient id="chevron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dffa6"/>
      <stop offset="1" stop-color="#16d98a"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2af0d0"/>
      <stop offset="1" stop-color="#22d3f0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#tile)"/>
  <rect x="33.5" y="33.5" width="957" height="957" rx="214.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
  <g opacity="0.75" filter="url(#glow)">
    <polyline points="262,316 462,512 262,708" fill="none" stroke="#22f09a" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="522" y="640" width="252" height="68" rx="16" fill="#22d3f0"/>
  </g>
  <polyline points="262,316 462,512 262,708" fill="none" stroke="url(#chevron)" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="522" y="640" width="252" height="68" rx="16" fill="url(#cursor)"/>
</svg>
